<!doctype html><html><body style="margin:0;background:#333">
<canvas id="c" width="2000" height="1400"></canvas>
<script src="../web/core.js"></script><script src="../web/art.js"></script>
<script>
const x=document.getElementById('c').getContext('2d');
x.fillStyle='#5a3a20';x.fillRect(0,0,2000,1400);
let px=0;
for(const set of ['classic','wood','caps']){ [1,2,-1,-2].forEach((c,i)=>x.drawImage(ART.piece(c,180,set),20+i*190,20+px*190)); px++; }
['barrel','parlor','tourney'].forEach((t,i)=>{const f=ART.boardFrame(t,440,370,false);x.drawImage(f,800+i*400,20,380,380);x.drawImage(ART.boardSurface(t,370),800+i*400+35*380/440,20+35*380/440,370*380/440,370*380/440);});
x.drawImage(ART.icon(512),20,600);
ART.FOLKS.forEach((f,i)=>x.drawImage(ART.avatar(f,200),560+i*215,620));
const sc=document.createElement('canvas');ART.scene(sc,800,560,1,{lx:40,ly:40,lw:500,lh:480});x.drawImage(sc,560,840,700,490);
// pieces on a board
const b=ART.boardSurface('tourney',480);x.drawImage(b,1300,860);
[[0,1,1],[1,0,2],[2,1,-1],[3,2,-2],[4,3,1]].forEach(([r,c,p])=>x.drawImage(ART.piece(p,60,'classic'),1300+c*60,860+r*60,60,60));
document.title='done';
</script></body></html>
